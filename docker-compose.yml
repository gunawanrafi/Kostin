  ai:
    profiles: [services]
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://kostin:kostin123@postgres:5432/kostin_dev
